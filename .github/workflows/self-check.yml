# Checks this repo itself: the decisions, the plugin, and that nothing is in
# it that does not belong in a public repo. No dependencies, using Node's own
# test runner.
name: Self-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Decisions, plugin and public
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      # The same validation Claude Code runs on install.
      - name: Validate plugin
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          npx --yes @anthropic-ai/claude-code plugin validate plugins/software-factory
