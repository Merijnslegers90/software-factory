# Checks this repo itself: the decisions, the plugin, and that nothing is in
# it that does not belong in a public repo. No dependencies, using Node's own
# test runner.
name: Self-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Decisions, plugin and public
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Only svelte, to render the admin blocks in their tests (F-0020).
      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      # The same validation Claude Code runs on install.
      - name: Validate plugin
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          npx --yes @anthropic-ai/claude-code plugin validate plugins/software-factory
