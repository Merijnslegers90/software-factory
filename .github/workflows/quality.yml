# The factory's quality check (F-0007). A project calls this workflow instead
# of maintaining its own variant:
#
#   jobs:
#     quality:
#       uses: Merijnslegers90/software-factory/.github/workflows/quality.yml@v1
#       with:
#         e2e: true
#
# Runs lint, check, test and build, and optionally the end-to-end tests, with
# the fake values from .env.example. No secrets are needed and no external
# service is called (F-0005). Building and publishing is Vercel's job; this
# workflow only checks that everything still holds.
name: Quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version.
        type: string
        default: '22'
      pnpm-version:
        description: pnpm version. Leave empty to take "packageManager" from package.json.
        type: string
        default: ''
      env-file:
        description: File with fake values that is copied to .env.
        type: string
        default: .env.example
      build:
        description: Whether the production build runs.
        type: boolean
        default: true
      e2e:
        description: Whether the Playwright end-to-end tests run.
        type: boolean
        default: false
      timeout-minutes:
        description: How long the check may take.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The type check and the build want a .env; the fake values suffice.
      - name: Prepare env
        env:
          ENV_FILE: ${{ inputs.env-file }}
        run: |
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
          else
            echo "No $ENV_FILE found; continuing without .env."
          fi

      - name: Format and lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        if: inputs.build
        run: pnpm run build

      # Chromium only: the e2e tests do not run per browser. --with-deps
      # installs system packages through apt; when Ubuntu's package servers
      # cannot be reached from the runner, that step hangs for about ten
      # minutes and then fails. So it gets three minutes, and after that only
      # the browser is installed: the runner image ships Google Chrome, and with
      # it the libraries Chromium needs.
      - name: Install browser
        if: inputs.e2e
        run: |
          timeout 180 pnpm exec playwright install --with-deps chromium \
            || pnpm exec playwright install chromium

      - name: End-to-end tests
        if: inputs.e2e
        run: pnpm run test:e2e

      - name: Keep the Playwright report on failure
        if: failure() && inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
