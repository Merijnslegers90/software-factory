# Controleert deze repo zelf: de besluiten, de plugin en dat er niets in staat
# wat in een publieke repo niet hoort. Zonder afhankelijkheden, met de
# testrunner van Node.
name: Zelfcontrole

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    name: Besluiten, plugin en publiek
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      # Dezelfde controle die Claude Code bij het installeren doet.
      - name: Plugin valideren
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          npx --yes @anthropic-ai/claude-code plugin validate plugins/software-factory
